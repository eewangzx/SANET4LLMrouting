[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-msd-core"
version = "0.2.0"
description = "Data-independent system model and two-stage microservice deployment methods"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11", "networkx>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.9"]
routing = ["torch>=2.2"]
reports = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["edge_msd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
